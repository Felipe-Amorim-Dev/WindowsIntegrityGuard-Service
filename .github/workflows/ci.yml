name: Windows .NET verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore WindowsIntegrityGuard/WindowsIntegrityGuard.sln
      - run: dotnet build WindowsIntegrityGuard/WindowsIntegrityGuard.sln --no-restore --configuration Release
      - run: dotnet test WindowsIntegrityGuard/WindowsIntegrityGuard.sln --no-build --configuration Release
